[package]
name = "rechat"
version = "0.3.14"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.3.9: tokio-tungstenite's DEFAULT features are connect+handshake
# only — NO TLS. Every wss:// connect in the app (MasterStream AND
# direct Kick Pusher) therefore failed at once with "reconnecting"
# forever, while the reqwest (rustls) fetches worked fine. Enable
# rustls with the Mozilla roots so wss:// actually works.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# MasterStream WS handshake (0.3.8): build the request to send the
# browser widget's Origin header.
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Kick OAuth (M8): PKCE + browser open
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
open = "5"

[profile.release]
lto = true
codegen-units = 1
