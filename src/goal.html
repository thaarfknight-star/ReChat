<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReChat Goal Overlay</title>
  <link rel="stylesheet" href="./overlay.css" />
</head>
<body>
  <div id="goal">
    <div class="title">هدف فالوور</div>
    <div class="stats">
      <div class="stat cur"><span class="lbl" id="lblCurrent">فعلی</span><span class="val"><span id="current">۱۴۵</span> <span id="unit"></span></span></div>
      <div class="stat tgt"><span class="lbl" id="lblTarget">هدف</span><span class="val"><span id="target">۳۰۰</span> <span id="unit2"></span></span></div>
      <div class="stat pct"><span class="lbl" id="lblPct">پیشرفت</span><span class="val" id="pct">۴۸٪</span></div>
    </div>
    <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
    <div id="goalError"></div>
  </div>
  <script type="module" src="./goal.ts"></script>
</body>
</html>
